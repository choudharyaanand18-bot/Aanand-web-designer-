<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Little Surprise</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#4a1d3a;--pk:#ec4899;--pk2:#c9447f;--cd:#fffaf0;--sh:#3a1830;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#4a1d3a}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:'Space Mono',ui-monospace,monospace;color:var(--ink);background:linear-gradient(165deg,#fbe4ee,#fbe6d8 45%,#e6d9f6);display:flex;align-items:center;justify-content:center;overflow:hidden}
#dusk{position:fixed;inset:0;background:linear-gradient(#9d8fa3,#b49288);opacity:0;transition:opacity 1.4s}
body.dusk #dusk{opacity:1}
canvas{position:fixed;inset:0;pointer-events:none;z-index:5}
.win{width:min(330px,88vw);background:var(--cd);border:2px solid var(--sh);box-shadow:4px 4px 0 var(--sh);position:relative;z-index:2;overflow:hidden;transition:opacity .45s,transform .45s;animation:pop .4s ease;
background-image:radial-gradient(circle,#9a8a99 2px,transparent 2.5px),radial-gradient(circle,#9a8a99 2px,transparent 2.5px),radial-gradient(circle,#9a8a99 2px,transparent 2.5px),radial-gradient(circle,#9a8a99 2px,transparent 2.5px);background-repeat:no-repeat;background-position:7px 32px,calc(100% - 7px) 32px,7px calc(100% - 7px),calc(100% - 7px) calc(100% - 7px)}
.win.out{opacity:0;transform:scale(.94)}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.bar{background:var(--pk);color:#fff;font-weight:700;font-size:10px;letter-spacing:.08em;padding:6px 8px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--sh)}
.bar b{display:flex;gap:3px}.bar b i{width:7px;height:7px;border:1.5px solid #fff;background:#f9a8d4}
.bar u{text-decoration:none;cursor:pointer;background:#fff;color:var(--sh);padding:0 5px;font-size:11px}
.body{padding:22px 18px;text-align:center;min-height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
h1{font-size:17px;margin:0;color:var(--pk2);line-height:1.35}
p{margin:0;font-size:10.5px;opacity:.85;line-height:1.6}
.btn{font:700 11px 'Space Mono',monospace;background:var(--pk);color:#fff;border:2px solid var(--sh);box-shadow:3px 3px 0 var(--sh);padding:9px 14px;cursor:pointer}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
.big{font-size:64px;font-weight:700;color:var(--pk2);line-height:1}
.dots{display:flex;gap:5px}.dots i{width:7px;height:7px;border-radius:50%;background:#f3b6d1;transition:.3s}.dots i.on{background:var(--pk2)}
.ct{position:absolute;left:0;right:0;top:32px;bottom:0;z-index:3;overflow:hidden}
.ct.open{pointer-events:none}
.pn{position:absolute;top:0;bottom:0;width:50.5%;background:repeating-linear-gradient(90deg,#b3306f 0 10px,#8e1f57 10px 16px,#c9447f 16px 25px,#8e1f57 25px 31px);transition:transform 1.5s cubic-bezier(.7,0,.3,1)}
.pn.l{left:0}.pn.r{right:0}
.ct.open .l{transform:translateX(-101%)}.ct.open .r{transform:translateX(101%)}
.val{position:absolute;left:0;right:0;top:0;height:30px;background:linear-gradient(#5a1038,#9c2a68);border-bottom:2px solid #e0b25c;border-radius:0 0 50% 50%/0 0 12px 12px;transition:transform 1s 1.3s}
.ct.open .val{transform:translateY(-110%)}
.rope{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:linear-gradient(90deg,#b8862e,#f3d27a,#b8862e);transition:opacity .6s .6s}
.ct.open .rope{opacity:0}
.hb{position:absolute;left:50%;top:44%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:#d65a9a;border:3px solid #f8d6e8;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;touch-action:none;transition:opacity .5s,transform .5s}
.hb small{font-size:6px;font-weight:700;letter-spacing:.05em}
.hb::before{content:'';position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(#fff var(--p,0deg),transparent 0);-webkit-mask:radial-gradient(circle,transparent 36px,#000 37px);mask:radial-gradient(circle,transparent 36px,#000 37px)}
.ct.open .hb,.ct.open .lab{opacity:0;transform:scale(.6)}
.lab{position:absolute;left:50%;top:72%;transform:translateX(-50%);background:#f1e4ea;border:1px solid #999;font-size:6.5px;padding:3px 6px;white-space:nowrap;color:#5a1038;transition:opacity .4s}
.spark{animation:tw 1.6s infinite}@keyframes tw{50%{opacity:.4;transform:scale(1.1)}}
.fw{animation:fw 2.4s infinite;opacity:0}@keyframes fw{0%{transform:scale(.2);opacity:0}20%{opacity:1}100%{transform:scale(1.6);opacity:0}}
.tail{animation:tl 1.2s ease-in-out infinite alternate;transform-origin:72px 130px}@keyframes tl{to{transform:rotate(-18deg)}}
.hd{animation:hbb 1.6s ease-in-out infinite;transform-origin:100px 115px}@keyframes hbb{50%{transform:rotate(3deg) translateY(1px)}}
.bl{animation:bk 3.2s infinite;transform-box:fill-box;transform-origin:center}@keyframes bk{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.mo{animation:mo .7s infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes mo{to{transform:scaleY(.3)}}
.fly{animation:fl2 2.2s ease-in-out infinite alternate}@keyframes fl2{from{transform:translate(-12px,3px) rotate(-3deg)}to{transform:translate(12px,-6px) rotate(3deg)}}
.float{animation:fy 2s ease-in-out infinite}@keyframes fy{50%{transform:translateY(-6px)}}
#bx{position:relative;width:220px;height:170px;touch-action:none;border:1.5px dashed #e4a3c3;cursor:crosshair}
#bx svg{position:absolute;inset:0}
.fl{animation:fk .45s infinite alternate;transform-box:fill-box;transform-origin:bottom}@keyframes fk{to{transform:scale(1.2,.85)}}
.gal{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;width:100%;padding:8px calc(50% - 72px) 14px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.pol{flex:0 0 144px;scroll-snap-align:center;background:#fff;padding:7px 7px 18px;border:2px solid var(--sh);font-size:8px;transition:transform .15s,opacity .15s}
.ph{height:165px;background:linear-gradient(135deg,#f9c5d9,#d9c6f3);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.ph video{width:100%;height:100%;object-fit:cover;background:#000}
.sm svg{width:100%;height:auto}
.env{width:210px;height:110px;border:2px solid var(--sh);background:#fffdf5;box-shadow:3px 3px 0 var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:8px;cursor:pointer}
.seal{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f472b6,#be2f7c);border:2px solid var(--sh);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;animation:beat 1.3s infinite}
.seal.crack{animation:shk .12s 7}
@keyframes beat{50%{transform:scale(1.1)}}@keyframes shk{50%{transform:translateX(3px) rotate(8deg)}}
.msg{background:#fffdf3;border:2px solid var(--sh);width:100%;height:250px;overflow:auto;text-align:left;padding:10px;font-size:11px;line-height:1.7;white-space:pre-wrap}
#edit{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:9;font:11px 'Space Mono',monospace;background:var(--cd);color:var(--ink);border:2px solid var(--sh);padding:5px 9px;cursor:pointer;opacity:.8}
#panel{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:14px}
#panel .win{max-height:90vh;overflow:auto}
#panel label{display:block;font-size:11px;text-align:left;margin:8px 0 3px;font-weight:700}
#panel input,#panel textarea{width:100%;font:12px 'Space Mono',monospace;padding:7px;border:2px solid var(--sh);background:#fff;color:#3a1830}
#panel input[type=color]{width:40px;height:28px;padding:0;vertical-align:middle}
</style></head>
<body><div id="dusk"></div><canvas id="cv"></canvas><div id="app"></div>
<button id="edit" hidden>✏️ Customize</button>
<div id="panel"><div class="win"><div class="bar"><b><i></i><i></i><i></i></b><span>CUSTOMIZE.CFG</span></div><div class="body" style="align-items:stretch;min-height:0">
<div><label>Naam (jaise: My Girl)</label><input id="cn"><label>Umar</label><input id="ca" type="number"><label>Letter message</label><textarea id="cm" rows="7"></textarea><label>Photos (3–6)</label><input id="cp" type="file" accept="image/*" multiple>
<label>🎬 Video (gallery mein add hoga, max 3)</label><input id="vf" type="file" accept="video/*" multiple>
<select id="vp" style="width:100%;font:11px 'Space Mono',monospace;padding:6px;border:2px solid var(--sh);margin-top:4px"><option value="0">Video: Gallery mein</option><option value="1">Video: Cat animation par (cat ke saath)</option><option value="2">Video: Cat animation par (cat ki jagah)</option></select>
<label>🐱 Cat customize</label><div style="display:flex;gap:5px;flex-wrap:wrap"><button type="button" class="btn" style="padding:4px 7px;font-size:10px" onclick="k1.value=k2.value='#2b2433'">⚫ Black</button><button type="button" class="btn" style="padding:4px 7px;font-size:10px" onclick="k1.value=k2.value='#ffffff'">⚪ White</button><button type="button" class="btn" style="padding:4px 7px;font-size:10px" onclick="k1.value=k2.value='#f59e0b'">🟠 Orange</button><button type="button" class="btn" style="padding:4px 7px;font-size:10px" onclick="k1.value=k2.value='#b9b4c3'">🔘 Grey</button></div>
<div style="display:flex;gap:10px;flex-wrap:wrap;font-size:10px;margin-top:8px;text-align:left"><span>Loading cat <input type="color" id="k1"></span><span>Party cat <input type="color" id="k2"></span><span>Bow <input type="color" id="k3"></span><span>Hat <input type="color" id="k4"></span></div>
<label>🎭 Apna character lagao (image / GIF / PNG)</label>
<div style="font-size:10px;text-align:left">Loading screen wala:</div><input id="u1" type="file" accept="image/*">
<div style="font-size:10px;text-align:left;margin-top:4px">Party screen wala:</div><input id="u2" type="file" accept="image/*">
<label>Ya emoji character chuno</label><select id="em" style="width:100%;font:14px 'Space Mono',monospace;padding:6px;border:2px solid var(--sh)"><option value="">Default cat drawing</option><option>🐱</option><option>🐶</option><option>🐰</option><option>🐻</option><option>🦊</option><option>🐼</option><option>🐸</option><option>🐥</option><option>🦄</option></select>
<button type="button" class="btn" style="padding:4px 7px;font-size:10px;margin-top:6px" onclick="C.pic=[null,null];C.emo='';em.value='';u1.value=u2.value=''">↺ Default cat wapas</button></div>
<button class="btn" id="cs">Save &amp; Replay</button></div></div></div>
<script>
// ===== Yahan apni details badlo =====
const C={name:"My Girl",age:20,
msg:"My favorite person 🕊️\n\nYou know, having you in my life makes everything feel a little brighter and a lot more beautiful 🤗\n\nI love the way you make me smile, the way you make ordinary moments feel special, and the way you somehow make my heart feel at home 😊\n\nI want us to share unlimited laughs, love, silly fights, late-night talks, and countless beautiful memories together 🧿\n\nThank you for being my comfort, my happiness, and my favorite person in every sense ❤️\n\nI love you forever and ever ♥",
photos:[],vids:[],vp:0,pic:[null,null],emo:'',cat:{fur:'#2b2433',pfur:'#b9b4c3',bow:'#ec4899',hat:'#8ecbf0'}};
// =====================================
const $=i=>document.getElementById(i),app=$('app'),cv=$('cv'),cx=cv.getContext('2d');
let P=[],raf=0,T=[];
const later=(f,ms)=>T.push(setTimeout(f,ms));
function sz(){cv.width=innerWidth;cv.height=innerHeight}sz();addEventListener('resize',sz);
function confetti(n=160,o){const K=['#ec4899','#f472b6','#f9a8d4','#fb7185','#fbbf24'];for(let i=0;i<n;i++){const a=Math.random()*6.28,v=3+Math.random()*9;P.push(o?{x:o.x,y:o.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5,g:.16,s:2+Math.random()*3,c:K[i%5],l:340}:{x:Math.random()*cv.width,y:-Math.random()*cv.height*.6,vx:(Math.random()-.5)*1.5,vy:1+Math.random()*3,s:2+Math.random()*3,c:K[i%5],l:300})}if(!raf)loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l-->0&&p.y<cv.height);P.forEach(p=>{if(p.g){p.vy+=p.g;p.vx*=.97;if(p.vy>2.2)p.g=0}p.x+=p.vx+Math.sin(p.y/30)*.4;p.y+=p.vy;cx.globalAlpha=Math.min(1,p.l/40);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s)});raf=P.length?requestAnimationFrame(loop):0}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function win(t,inner,x=''){app.innerHTML=`<div class="win"><div class="bar"><b><i></i><i></i><i></i></b><span>${t}</span>${x}</div><div class="body">${inner}</div></div>`}
function go(f){const w=app.firstChild;w&&w.classList.add('out');later(f,450)}

function s0(){T.forEach(clearTimeout);T=[];document.body.classList.remove('dusk');
 win('SEAL.EXE',`<div class="big" id="n">3</div><div class="dots" id="d"><i class="on"></i><i></i><i></i></div><div class="ct" id="ct"><div class="pn l"></div><div class="pn r"></div><div class="val"></div><div class="rope"></div><div class="hb" id="hb"><span style="font-size:22px">♥</span><small id="ht">HOLD ME</small></div><div class="lab">DON’T LET GO UNTIL IT OPENS!</div></div>`);
 const hb=$('hb');let p=0,iv=0;
 const stop=()=>{clearInterval(iv);if(p<100){p=0;hb.style.setProperty('--p','0deg');$('ht').textContent='HOLD ME'}};
 hb.onpointerdown=e=>{hb.setPointerCapture(e.pointerId);$('ht').textContent='OPENING…';iv=setInterval(()=>{p+=3.4;hb.style.setProperty('--p',p*3.6+'deg');if(p>=100){clearInterval(iv);$('ct').classList.add('open');hb.onpointerdown=null;later(count,1700)}},50)};
 hb.onpointerup=hb.onpointercancel=stop}
function count(){let n=3;const t=()=>{if(n>0){n--;$('n').textContent=n;[...$('d').children].forEach((e,i)=>e.classList.toggle('on',i<=3-n&&i<3));later(t,950)}else go(s1)};later(t,950)}
const fw=(x,y,c,d)=>`<g class="fw" style="animation-delay:${d}s;transform-origin:${x}px ${y}px">${[0,45,90,135,180,225,270,315].map(a=>`<line x1="${x}" y1="${y-6}" x2="${x}" y2="${y-15}" stroke="${c}" stroke-width="3" stroke-linecap="round" transform="rotate(${a} ${x} ${y})"/>`).join('')}</g>`;
const partyCat=()=>`<svg viewBox="0 0 200 165" width="190">${fw(55,42,'#f9a8d4',0)}${fw(110,26,'#c4b5fd',.8)}${fw(155,50,'#fbbf24',1.6)}<g stroke="#4a4458" stroke-width="2" stroke-linejoin="round"><path class="tail" d="M72 132q-30 4-28-22" stroke="#8d8798" stroke-width="9" fill="none" stroke-linecap="round"/><ellipse cx="100" cy="128" rx="28" ry="28" fill="#f3f0f5"/><ellipse cx="88" cy="152" rx="9" ry="6" fill="#fff"/><ellipse cx="112" cy="152" rx="9" ry="6" fill="#fff"/><g class="hd"><polygon points="70,64 68,38 92,54" fill="#b9b4c3"/><polygon points="130,64 132,38 108,54" fill="#b9b4c3"/><polygon points="73,58 72,45 84,54" fill="#f9a8d4" stroke="none"/><polygon points="127,58 128,45 116,54" fill="#f9a8d4" stroke="none"/><circle cx="100" cy="84" r="34" fill="#b9b4c3"/><ellipse cx="100" cy="97" rx="19" ry="13" fill="#fff" stroke="none"/><g stroke="#6d6679" stroke-width="2.5" stroke-linecap="round"><line x1="94" y1="60" x2="94" y2="67"/><line x1="100" y1="58" x2="100" y2="66"/><line x1="106" y1="60" x2="106" y2="67"/></g><ellipse class="bl" cx="86" cy="86" rx="3" ry="4.5" fill="#2b2433" stroke="none"/><ellipse class="bl" cx="114" cy="86" rx="3" ry="4.5" fill="#2b2433" stroke="none"/><circle cx="78" cy="95" r="4" fill="#f9a8d4" stroke="none"/><circle cx="122" cy="95" r="4" fill="#f9a8d4" stroke="none"/><polygon points="97,92 103,92 100,96" fill="#f472b6" stroke="none"/><ellipse class="mo" cx="100" cy="102" rx="5" ry="4" fill="#c2415d" stroke-width="1.5"/><polygon points="80,56 96,20 114,54" fill="#8ecbf0"/><line x1="86" y1="42" x2="108" y2="44" stroke="#fff"/><line x1="91" y1="31" x2="102" y2="32" stroke="#fff"/><circle cx="96" cy="19" r="4" fill="#fff"/></g><polygon points="100,120 80,108 80,128" fill="#ec4899"/><polygon points="100,120 120,108 120,128" fill="#ec4899"/><circle cx="100" cy="120" r="6" fill="#f472b6"/><ellipse cx="152" cy="152" rx="32" ry="6" fill="#8ecbf0"/><rect x="132" y="126" width="40" height="26" rx="7" fill="#fbcfe8"/><ellipse cx="152" cy="126" rx="20" ry="6" fill="#fff"/><circle cx="142" cy="140" r="3" fill="#fb7185" stroke="none"/><circle cx="156" cy="143" r="3" fill="#fbbf24" stroke="none"/><circle cx="164" cy="136" r="3" fill="#fb7185" stroke="none"/><rect x="150.5" y="108" width="3" height="16" fill="#f9a8d4"/><ellipse class="fl" cx="152" cy="103" rx="3.5" ry="6" fill="#fbbf24" stroke="none"/></g></svg>`;
const planeCat=()=>`<svg class="fly" viewBox="0 0 220 130" width="210"><g stroke="#4a4458" stroke-width="2" stroke-linejoin="round"><polygon points="14,78 206,46 122,112 106,90" fill="#fff"/><polygon points="106,90 206,46 122,112" fill="#fbcfe8"/><polygon points="84,50 80,28 98,40" fill="#2b2433"/><polygon points="128,46 134,26 112,38" fill="#2b2433"/><polygon points="85,45 83,34 93,41" fill="#f9a8d4" stroke="none"/><polygon points="127,42 130,32 117,38" fill="#f9a8d4" stroke="none"/><circle cx="108" cy="58" r="26" fill="#2b2433"/><ellipse cx="98" cy="58" rx="4" ry="5" fill="#fde047" class="bl" stroke="none"/><ellipse cx="118" cy="58" rx="4" ry="5" fill="#fde047" class="bl" stroke="none"/><ellipse cx="98" cy="58" rx="1.4" ry="4" fill="#1a1420" class="bl" stroke="none"/><ellipse cx="118" cy="58" rx="1.4" ry="4" fill="#1a1420" class="bl" stroke="none"/><polygon points="105,64 111,64 108,68" fill="#f472b6" stroke="none"/><g stroke="#d9d2e3" stroke-width="1.2" stroke-linecap="round"><line x1="84" y1="62" x2="72" y2="60"/><line x1="84" y1="66" x2="73" y2="69"/><line x1="132" y1="62" x2="144" y2="60"/><line x1="132" y1="66" x2="143" y2="69"/></g><polygon points="122,36 138,28 136,44" fill="#ec4899"/><polygon points="122,36 112,26 108,40" fill="#ec4899"/><circle cx="122" cy="36" r="4" fill="#f472b6"/><ellipse cx="96" cy="84" rx="8" ry="5" fill="#2b2433"/><ellipse cx="120" cy="84" rx="8" ry="5" fill="#2b2433"/></g></svg>`;
const lum=h=>{const n=parseInt(h.slice(1),16);return(n>>16)*.3+((n>>8&255)*.6)+(n&255)*.1};
const tint=(s,p)=>{const k=C.cat,f=p?k.pfur:k.fur;s=s.replaceAll(p?'#b9b4c3':'#2b2433',f).replaceAll('#8d8798',f).replaceAll('#ec4899',k.bow).replaceAll('#8ecbf0',k.hat);return p?(lum(f)<90?s.replaceAll('#2b2433','#fde047'):s):s.replaceAll('#d9d2e3',lum(f)>150?'#4a4458':'#d9d2e3')};
const chr=p=>{const i=C.pic[p],c=p?'float':'fly';if(p&&C.vp&&C.vids[0]){const vd='<video src="'+C.vids[0]+'" muted loop autoplay playsinline onclick="this.muted=!this.muted" style="width:190px;max-height:130px;object-fit:cover;border:2px solid var(--sh);box-shadow:3px 3px 0 var(--sh);background:#000"></video>';return C.vp==2?vd:vd+'<div class="sm '+c+'" style="width:115px">'+tint(partyCat(),1)+'</div>'}if(i)return `<img src="${i}" alt="" class="${c}" style="max-width:190px;max-height:150px;object-fit:contain">`;if(C.emo)return `<div class="${c}" style="font-size:${p?60:56}px">${C.emo}${p?'🎂':'✈️'}</div>`;return tint(p?partyCat():planeCat(),p)};
function s1(){win('SEAL.EXE',`${chr(0)}<p style="color:var(--pk2)">Loading your birthday surprise...</p><div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i></div>`);later(()=>go(s2),2200)}
function s2(){win('PARTY.EXE',`${chr(1)}<h1>${esc(C.name)} was born ${C.age} years ago today!</h1><p class="spark">✨ Yes, it’s YOU! A little surprise awaits... ✨</p><button class="btn" id="b">🎁 START THE SURPRISE</button>`);$('b').onclick=()=>go(s3)}

function s3(){
 const cake=`<g id="ck" stroke="#3a1830" stroke-width="2"><ellipse cx="110" cy="138" rx="78" ry="12" fill="#fff"/><rect x="40" y="92" width="140" height="42" rx="8" fill="#f9a8d4"/><rect x="58" y="62" width="104" height="34" rx="8" fill="#e0c3f5"/><path d="M58 76q9 12 18 0t18 0 18 0 18 0 18 0 14 0" fill="#fff" stroke="none"/>${[0,1,2].map(i=>`<rect x="${84+i*26}" y="38" width="5" height="24" fill="#bbf7d0"/>`).join('')}</g>`;
 const fl=[0,1,2].map(i=>`<ellipse class="fl" cx="${86.5+i*26}" cy="30" rx="4" ry="8" fill="#fbbf24"/>`).join('');
 win('CAKE.EXE',`<h1 id="h">Swipe to Cut the Cake! 🍰</h1><p id="p">Drag your finger/cursor inside box to slice</p>
 <div id="bx"><svg viewBox="0 0 220 170" width="220" height="170"><defs><clipPath id="L"><rect x="0" y="0" width="110" height="170"/></clipPath><clipPath id="R"><rect x="110" y="0" width="110" height="170"/></clipPath></defs><g clip-path="url(#L)">${cake}</g><g id="rt" clip-path="url(#R)" style="transition:.6s">${cake}</g><g id="fl">${fl}</g><polyline id="tr" fill="none" stroke="#ec4899" stroke-width="4" stroke-linecap="round" points=""/></svg></div>
 <button class="btn" id="b" style="visibility:hidden">NEXT →</button>`);
 const bx=$('bx'),tr=$('tr');let down=0,pts=[],len=0,done=0,lp;
 bx.onpointerdown=e=>{down=1;pts=[];lp=null;bx.setPointerCapture(e.pointerId)};
 bx.onpointermove=e=>{if(!down||done)return;const r=bx.getBoundingClientRect(),q=[e.clientX-r.left,e.clientY-r.top];if(lp)len+=Math.hypot(q[0]-lp[0],q[1]-lp[1]);lp=q;pts.push(q.join(','));tr.setAttribute('points',pts.join(' '));
  if(len>150){done=1;tr.setAttribute('points','');$('fl').remove();$('rt').style.transform='translate(10px,4px) rotate(4deg)';$('h').textContent=`Happy Birthday, ${C.name}! 💗`;$('p').textContent='';$('b').style.visibility='visible';const r=bx.getBoundingClientRect();confetti(280,{x:r.left+r.width/2,y:r.top+r.height/2});confetti(140);$('b').onclick=()=>go(s4)}};
 bx.onpointerup=()=>{down=0;tr.setAttribute('points','');len=0;lp=null}}

function s4(){const ph=(C.photos.length?C.photos:[1,2,3,4]).concat((C.vp?[]:C.vids).map(v=>({v})));
 win('GALLERY.EXE',`<h1>Our Memories 💗</h1><p>Swipe through some beautiful moments</p><div class="gal" id="g">${ph.map((p,i)=>`<div class="pol"><div class="ph">${typeof p==='string'?`<img src="${p}" alt="">`:p.v?`<video src="${p.v}" muted loop autoplay playsinline controls></video>`:'📸'}</div><div style="margin-top:7px;text-align:center">${p.v?'VID':'IMG'}_${i+1}.${p.v?'mp4':'jpg'}</div></div>`).join('')}</div><div class="dots" id="dt">${ph.map(()=>'<i></i>').join('')}</div><button class="btn" id="b">♥ READ LETTER →</button>`);
 const g=$('g'),cs=[...g.children],ds=[...$('dt').children];
 const up=()=>{const m=g.scrollLeft+g.clientWidth/2;let bi=0,bd=1e9;cs.forEach((c,i)=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-m),k=Math.max(.72,1-d/450);c.style.transform=`scale(${k}) rotate(${(i%2?1:-1)*2.5*k}deg)`;c.style.opacity=Math.max(.55,k);if(d<bd){bd=d;bi=i}});ds.forEach((x,i)=>x.classList.toggle('on',i==bi))};
 g.onscroll=up;up();let k=0;const au=setInterval(()=>{if(!$('g'))return clearInterval(au);k=(k+1)%cs.length;g.scrollTo({left:cs[k].offsetLeft+72-g.clientWidth/2,behavior:'smooth'})},1900);g.onpointerdown=()=>clearInterval(au);$('b').onclick=()=>go(s5)}

function s5(){win('LETTER.EXE',`<h1>A Letter For You 💌</h1><p>Tap the wax seal to open your special message</p><div class="env" id="e"><div class="seal" id="s">♥</div><span id="tx">TAP TO OPEN</span></div><div class="dots"><i></i><i class="on"></i><i></i></div>`);
 $('e').onclick=()=>{$('s').classList.add('crack');$('tx').textContent='BREAKING...';$('e').onclick=null;later(()=>{document.body.classList.add('dusk');go(s6)},1000)}}

function s6(){win('MESSAGE.TXT',`<div class="msg" id="m"></div><button class="btn" id="b">↺</button>`,'<u id="x">✕</u>');
 let i=0;const m=$('m'),iv=setInterval(()=>{m.textContent=C.msg.slice(0,++i)+(i<C.msg.length?'▌':'');m.scrollTop=m.scrollHeight;if(i>=C.msg.length){clearInterval(iv);confetti(120)}},42);
 $('b').onclick=$('x').onclick=()=>{clearInterval(iv);go(s0)}}

const PN=$('panel');
try{window.claude&&claude.use('user').then(u=>u&&u.isOwner()).then(o=>{if(o)$('edit').hidden=false}).catch(()=>{})}catch(e){}
$('edit').onclick=()=>{cn.value=C.name;ca.value=C.age;cm.value=C.msg;k1.value=C.cat.fur;k2.value=C.cat.pfur;k3.value=C.cat.bow;k4.value=C.cat.hat;PN.style.display='flex'};
$('cs').onclick=async()=>{C.name=cn.value||C.name;C.age=+ca.value||C.age;C.msg=cm.value||C.msg;C.cat={fur:k1.value,pfur:k2.value,bow:k3.value,hat:k4.value};
 if(cp.files.length)C.photos=await Promise.all([...cp.files].slice(0,6).map(f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)})));
 const rd=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});
 if(u1.files[0])C.pic[0]=await rd(u1.files[0]);if(u2.files[0])C.pic[1]=await rd(u2.files[0]);if(em.value)C.pic=[null,null];C.emo=em.value;
 C.vp=+vp.value;if(vf.files.length)C.vids=[...vf.files].slice(0,3).map(f=>URL.createObjectURL(f));
 PN.style.display='none';s0()};
s0();
</script></body></html>
